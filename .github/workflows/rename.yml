name: Rename uploaded file to index.html
on: workflow_dispatch
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git mv kanak-mahak-website-upload.html index.html
          git commit -m "Rename kanak-mahak-website-upload.html to index.html"
          git push
