name: Rename upload to index
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rename.yml'
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file
        run: |
          if [ -f kanak-mahak-website-upload.html ]; then
            mv -f kanak-mahak-website-upload.html index.html
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Add green diamond favicon"
            git push
          fi
